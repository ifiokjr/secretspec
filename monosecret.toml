[project]
name = "monosecret"
revision = "1.0"
# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[providers]
onepassword-ci = "onepassword+token://Development"

# Profiles are omitted until they declare at least one secret; an empty
# `[profiles.<name>]` table is rejected by validation. Uncomment and populate
# one of these templates to add a profile.
# [profiles.default]
# DATABASE_URL = { description = "Database connection string", required = true }

# [profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
# DATABASE_URL = { default = "sqlite:///dev.db" }
#
# New secrets
# REDIS_URL = { description = "Redis connection URL for caching", required = false, default = "redis://localhost:6379" }

[profiles.ci]
# GITHUB_TOKEN is provided by GitHub Actions for each workflow run, so it is
# intentionally not loaded from 1Password. Dart publishing also needs no
# stored secret: the pub client (dart >= 3.6) mints its own OIDC token at
# publish time through pub.dev's automated-publishing rule for this
# repository (see .github/workflows/publish.yml).
RELEASE_PR_MERGE_TOKEN = { description = "GitHub token used to create, refresh, and merge release pull requests", providers = [
  "onepassword-ci",
], ref = { item = "monosecret", field = "RELEASE_PR_MERGE_TOKEN" } }
